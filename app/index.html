<style>
  :root {

    background: rgba(11, 8, 18, .86); border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }

    background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 13px; font-weight: 600; font-size: 14px; box-shadow: 0 14px 40px rgba(0, 0, 0, .5); max-width: calc(100% - 32px); }

  .wbarra { height: 5px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; margin-bottom: 12px; }

<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-v="hoy" class="on"><span>☀️</span>Hoy</button>
  <button data-v="semana"><span>📅</span>Semana</button>
  <button data-v="tareas"><span>✅</span>Tareas</button>

<script>
'use strict';
// ───────────── Centro JAN · app del iPhone
// Lee y escribe a través de tu API privada (Google Apps Script, con tu clave). Cada cambio que haces aquí viaja como un
// «cambio» independiente (buzón): nunca reescribe lo que hizo el PC o el bot, así que nada se pisa. Sin conexión,
// los cambios se guardan en el móvil y se envían solos al volver la red.
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const guardarLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const leerLS = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } };

// configuración: llega una vez por el enlace de Telegram (#k=…&u=…); la clave nunca viaja a GitHub (va tras el «#»)
// En iOS la app de la pantalla de inicio NO comparte memoria con Safari: por eso, en Safari, el enlace conserva la clave
// (y se quita el manifest) para que «Añadir a pantalla de inicio» se la lleve; ya instalada, la guarda y la borra del enlace.
const INSTALADA = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
function leerEnlace(texto) {
  const i = String(texto || '').indexOf('#'); if (i < 0) return null;
  const h = new URLSearchParams(String(texto).slice(i + 1));
  return h.get('k') && h.get('u') && /^https:\/\/script\.google\.com\//.test(h.get('u')) ? { k: h.get('k'), u: h.get('u') } : null;
}
(function () {
  const c = leerEnlace(location.href), previa = leerLS('cj_cfg', null);
  // en Safari un enlace recién abierto manda; en la app instalada, el enlace guardado del icono solo sirve la primera vez
  if (c && (!INSTALADA || !previa)) {
    guardarLS('cj_cfg', c);
    if (!INSTALADA) { const m = document.querySelector('link[rel="manifest"]'); if (m) m.remove(); }
  }
  if (c && INSTALADA) history.replaceState(null, '', location.pathname);
})();
let CFG = leerLS('cj_cfg', null);

const COLS = ['tareas', 'eventos', 'proyectos', 'metas'];
const S = { doc: leerLS('cj_doc', null), diag: leerLS('cj_diag', {}), pend: leerLS('cj_pend', []), vista: leerLS('cj_vista', 'hoy'),
  estado: 'cargando', ultima: leerLS('cj_ultima', null), abierto: null };

// ── mismo algoritmo de fusión que el PC y Apps Script (colecciones por id, objetos por clave)
/** Rutas de _campos (hasta 3 niveles): «campo», y luego «.clave» en objetos o «#id» en listas con id.
 *  Ej.: «notas» · «hitos#h1.hecho» · «trabajo.secciones#s1». Cada ruta lleva su hora en _acts. */
function trozosRuta(ruta) {
  const r = String(ruta), m = r.match(/^[^.#]+/), k = m ? m[0] : r, out = [['.', k]], re = /([.#])([^.#]+)/g, resto = r.slice(k.length);
  let x; while ((x = re.exec(resto)) !== null) out.push([x[1], x[2]]);
  return out;
}
function leerTrozo(v, t) {
  if (v == null || typeof v !== 'object') return undefined;
  if (t[0] === '#') return Array.isArray(v) ? v.find(function (e) { return e && typeof e === 'object' && String(e.id) === t[1]; }) : undefined;
  return Array.isArray(v) ? undefined : v[t[1]];
}
function ponerTrozo(cont, ts, i, val, hay) {
  const t = ts[i], lista = t[0] === '#';
  const c = lista ? (Array.isArray(cont) ? cont.slice() : []) : Object.assign({}, cont && typeof cont === 'object' && !Array.isArray(cont) ? cont : {});
  let pos = -1; if (lista) c.forEach(function (e, n) { if (pos < 0 && e && typeof e === 'object' && String(e.id) === t[1]) pos = n; });
  const actual = lista ? (pos >= 0 ? c[pos] : undefined) : c[t[1]], ultimo = i === ts.length - 1;
  let nuevo = val;
  if (!ultimo) { if (actual == null && !hay) return c; nuevo = ponerTrozo(actual, ts, i + 1, val, hay); }
  if (lista) { if (ultimo && !hay) { if (pos >= 0) c.splice(pos, 1); } else if (pos >= 0) c[pos] = nuevo; else c.push(nuevo); }
  else if (ultimo && !hay) delete c[t[1]]; else c[t[1]] = nuevo;
  return c;
}
/** Copia en `out` lo que hay en `nuevo` en esa ruta (o lo quita, si en `nuevo` ya no está) */
function aplicarRuta(out, nuevo, ruta) {
  const ts = trozosRuta(ruta); let v = nuevo, hay = true;
  for (let i = 0; i < ts.length; i++) { v = leerTrozo(v, ts[i]); if (v === undefined) { hay = false; break; } }
  const r = ponerTrozo(out, ts, 0, hay ? v : undefined, hay), k = ts[0][1];
  if (k in r) out[k] = r[k]; else delete out[k];
}
/** Hora de lo último escrito en esa ruta: la suya, o la de la ruta que la contiene, o la base */
function horaDe(acts, ruta, base) {
  let r = String(ruta);
  for (;;) { if (acts[r] != null) return acts[r]; const m = r.match(/^(.*)[.#][^.#]+$/); if (!m) return base; r = m[1]; }
}
/** Qué rutas cambian de `antes` a `ahora` (hasta 3 niveles) */
function camposDe(antes, ahora) {
  const fuera = ['act', '_campos', '_acts', '_base'], out = [];
  const igual = function (a, b) { return JSON.stringify(a) === JSON.stringify(b); };
  const conId = function (v) { return Array.isArray(v) && v.every(function (e) { return e && typeof e === 'object' && e.id != null; }); };
  const plano = function (v) { return v && typeof v === 'object' && !Array.isArray(v); };
  const unir = function (a, b) { const u = []; a.concat(b).forEach(function (x) { if (u.indexOf(x) < 0) u.push(x); }); return u; };
  const nodo = function (a, b, ruta, nivel) {
    if (igual(a, b)) return;
    if (nivel < 3 && conId(a) && conId(b)) unir(a.map(function (e) { return String(e.id); }), b.map(function (e) { return String(e.id); })).forEach(function (id) {
      nodo(a.find(function (e) { return String(e.id) === id; }), b.find(function (e) { return String(e.id) === id; }), ruta + '#' + id, nivel + 1);
    });
    else if (nivel < 3 && plano(a) && plano(b)) unir(Object.keys(a), Object.keys(b)).forEach(function (k) { nodo(a[k], b[k], ruta + '.' + k, nivel + 1); });
    else out.push(ruta);
  };
  unir(Object.keys(antes || {}), Object.keys(ahora || {})).forEach(function (k) { if (fuera.indexOf(k) < 0) nodo((antes || {})[k], (ahora || {})[k], k, 1); });
  return out;
}
/** Un elemento con `_campos` solo cambia esas rutas, cada una si es más nueva que lo último escrito en ella;
 *  sin `_campos` se sustituye entero (si es más nuevo: lo decide quien llama). */
function mezclar(previo, x, ts) {
  const limpio = Object.assign({}, x); delete limpio._campos; delete limpio._acts; delete limpio._base;
  if (!previo || !Array.isArray(x._campos)) return Object.assign(limpio, { act: ts, _base: ts });
  const out = Object.assign({}, previo), acts = Object.assign({}, previo._acts || {});
  const base = previo._base != null ? previo._base : (previo.act || 0);
  x._campos.forEach(function (ruta) {
    ruta = String(ruta); const k = trozosRuta(ruta)[0][1];
    if (['id', 'act', '_acts', '_base', '_campos'].indexOf(k) >= 0) return;
    if (ts < horaDe(acts, ruta, base)) return; // eso se cambió después en otro sitio: gana lo más nuevo
    aplicarRuta(out, limpio, ruta);
    Object.keys(acts).forEach(function (a) { if (a.indexOf(ruta + '.') === 0 || a.indexOf(ruta + '#') === 0) delete acts[a]; });
    acts[ruta] = ts;
  });
  out._acts = acts; out._base = base; out.act = Math.max(previo.act || 0, ts);
  return out;
}
/** Qué campos cambias de verdad (respecto a lo que tienes): solo esos viajan como cambio */
function conCampos(cambios) {
  Object.keys(cambios.col || {}).forEach((col) => {
    const actual = S.doc && S.doc[col] || [];
    cambios.col[col].set = (cambios.col[col].set || []).map((x) => {
      const y = actual.find((e) => e.id === x.id); if (!y || Array.isArray(x._campos)) return x;
      return Object.assign({}, x, { _campos: camposDe(y, x) });
    });
  });
  return cambios;
}
function aplicar(doc, c, ts) {
  doc.borrados = doc.borrados || {};
  Object.keys(c.col || {}).forEach((col) => {
    if (!COLS.includes(col)) return;
    const arr = doc[col] = doc[col] || [], pos = {};
    arr.forEach((x, i) => { pos[x.id] = i; });
    (c.col[col].set || []).forEach((x) => {
      if (!x || x.id == null) return;
      if ((doc.borrados[col + ':' + x.id] || 0) > ts) return; // se borró después: no resucita
      if (x.id in pos) { if (Array.isArray(x._campos) || (arr[pos[x.id]].act || 0) <= ts) arr[pos[x.id]] = mezclar(arr[pos[x.id]], x, ts); } else { pos[x.id] = arr.length; arr.push(mezclar(null, x, ts)); }
    });
    const del = c.col[col].del || [];
    if (del.length) { doc[col] = arr.filter((x) => !del.includes(x.id) || (x.act || 0) > ts); del.forEach((id) => { doc.borrados[col + ':' + id] = Math.max(ts, doc.borrados[col + ':' + id] || 0); }); }
  });
  Object.keys(c.obj || {}).forEach((k) => {
    if (COLS.includes(k) || k === 'borrados' || k === 'buzon_hecho') return;
    const t = doc[k] && typeof doc[k] === 'object' && !Array.isArray(doc[k]) ? doc[k] : (doc[k] = {});
    Object.assign(t, c.obj[k].set || {}); (c.obj[k].del || []).forEach((d) => { delete t[d]; });
  });
  return doc;
}

// ── red: lectura con GET, escritura con POST text/plain (sin preflight); reintentos con espera creciente
async function api(lote) {
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), lote && lote.length > 5 ? 120000 : 60000);
  try {
    const r = lote ? await fetch(CFG.u, { method: 'POST', body: JSON.stringify({ k: CFG.k, op: 'cambios', lote }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctrl.signal, redirect: 'follow' })
      : await fetch(CFG.u + '?k=' + encodeURIComponent(CFG.k) + '&t=' + Date.now(), { signal: ctrl.signal, redirect: 'follow' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'error');
    return j;
  } finally { clearTimeout(t); }
}
let enCurso = null, espera = 2000;
function sincronizar() {
  if (!CFG || enCurso) return enCurso;
  enCurso = (async () => {
    const lote = S.pend.slice(); enVuelo = lote.length;
    try {

  document.body.insertAdjacentHTML('beforeend', `<div class="toast" id="toast" role="status" aria-live="polite"><span>${esc(msg)}</span>${deshacer ? '<button id="undo">Deshacer</button>' : ''}</div>`);
  if (deshacer) $('#undo').onclick = () => { $('#toast').remove(); deshacer(); };
  tToast = setTimeout(() => { const x = $('#toast'); if (x) x.remove(); }, deshacer ? 6000 : 2200);
}

function pintar() {
  const app = $('#app');
  if (!CFG || S.estado === 'clave') {
    $('#tabs').hidden = true;
    app.innerHTML = `<div class="bienvenida"><div><img src="../icon-192.png" alt=""><h1>${CFG ? 'Hay que reconectar' : 'Conecta tu centro'}</h1>
      <p>${CFG ? 'La clave de la app ha cambiado. ' : ''}Abre el último enlace que te mandó tu bot de Telegram (@JanTheJuniper_Bot)${INSTALADA || CFG ? ', o cópialo y pégalo aquí:' : '.'}</p>
      ${INSTALADA || CFG ? `<form class="nueva" id="fenlace" style="margin-top:16px"><input class="inp" name="enlace" placeholder="Pega aquí el enlace" autocomplete="off"><button class="btn pri" type="submit">Conectar</button></form>` : ''}</div></div>`;
    const f = $('#fenlace');
    if (f) f.onsubmit = (e) => { e.preventDefault(); const c = leerEnlace(new FormData(f).get('enlace')); if (!c) { toast('Ese enlace no es el del bot'); return; } guardarLS('cj_cfg', c); CFG = c; S.estado = 'cargando'; pintar(); sincronizar(); };
    return;
  }
  if (!S.doc) { $('#tabs').hidden = true; app.innerHTML = `<div class="bienvenida"><div><img src="../icon-192.png" alt=""><h1>Cargando tu centro…</h1><p>${S.estado === 'off' ? 'Sin conexión: en cuanto vuelva la red aparece todo.' : 'Un momento.'}</p></div></div>`; return; }
  $('#tabs').hidden = false;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.v === S.vista));
  const est = S.estado === 'off' ? ['off', 'Sin conexión · ' + (S.pend.length ? S.pend.length + ' por enviar' : 'datos ' + hace(S.ultima))] : S.estado === 'err' ? ['err', 'Reintentando…'] : S.pend.length ? ['', 'Guardando…'] : ['', hace(S.ultima)];
  if (!['hoy', 'semana', 'tareas', 'proyectos', 'carrera'].includes(S.vista)) S.vista = 'hoy';
  const titulo = { hoy: largo(hoyISO()).replace(/^./, (c) => c.toUpperCase()), semana: 'Tus dos semanas', tareas: pendientes().length + ' pendientes', proyectos: 'Avance real de cada proyecto', carrera: 'Redes, métricas y diagnóstico' }[S.vista];
  const instalar = !INSTALADA && /iPhone|iPad/.test(navigator.userAgent) ? `<div class="card" style="border-color:var(--acc)"><b>Instálala:</b> botón Compartir ⬆️ → «Añadir a pantalla de inicio».</div>` : '';
  const fN = $('#nueva'), activo = document.activeElement;
  const selFoco = activo && app.contains(activo) && ['data-t', 'data-abrir', 'data-dia', 'data-p', 'data-v', 'id'].map((k) => activo.getAttribute(k) ? `[${k}="${activo.getAttribute(k)}"]` : '').find(Boolean);
  const borrador = fN ? { titulo: fN.titulo.value, fecha: fN.fecha.value, prioridad: fN.prioridad.value, proyecto: fN.proyecto.value, foco: activo && fN.contains(activo) ? activo.name : null } : null;
  app.innerHTML = instalar + `<header><img src="../icon-192.png" alt="JN"><div class="t"><h1>${S.vista === 'hoy' ? 'Hola, Jan' : { semana: 'Semana', tareas: 'Tareas', proyectos: 'Proyectos', carrera: 'Carrera' }[S.vista]}</h1><small>${esc(titulo)}</small></div><button class="estado ${est[0]}" id="refrescar">${esc(est[1])}</button></header>
    <div class="vista">${{ hoy: vHoy, semana: vSemana, tareas: vTareas, proyectos: vProyectos, carrera: vCarrera }[S.vista]()}</div>`;
  if (selFoco && !$('#hoja') && !(borrador && borrador.foco)) { const v = app.querySelector(selFoco); if (v) v.focus({ preventScroll: true }); }
  const gN = $('#nueva');
  if (borrador && gN) {
    gN.titulo.value = borrador.titulo; gN.fecha.value = borrador.fecha; gN.prioridad.value = borrador.prioridad; gN.proyecto.value = borrador.proyecto;
    if (borrador.foco && gN[borrador.foco] && !$('#hoja')) gN[borrador.foco].focus();
  }
  if (S.abierto) rehacerProyecto(S.abierto);

}

// delegación de eventos (una sola vez)
document.addEventListener('click', (e) => {
  const ab = e.target.closest('[data-abrir]'); if (ab && (!e.target.closest('button') || e.target.closest('button.seguir'))) { hojaTarea(ab.dataset.abrir); return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.closest('#tabs') && b.dataset.v) { S.vista = b.dataset.v; guardarLS('cj_vista', S.vista); window.scrollTo(0, 0); pintar(); return; }
  if (b.id === 'refrescar') { sincronizar(); return; }
  if (b.id === 'verHechas') { S.verHechas = !S.verHechas; pintar(); return; }
  if (b.id === 'apple') { hojaApple(); return; }
  if (b.dataset.t) { const t = (S.doc.tareas || []).find((x) => x.id === b.dataset.t); if (t) marcar(t); return; }
  if (b.dataset.a) { const a = ((S.diag && S.diag.avisos) || []).find((x) => x.id === b.dataset.id); if (!a) return; b.dataset.a === 'tarea' ? avisoATarea(a) : aviso(a, b.dataset.a); return; }
  if (b.dataset.dia) { hojaTurno(b.dataset.dia); return; }
  if (b.dataset.p) { hojaProyecto(b.dataset.p); return; }
});
document.addEventListener('keydown', (e) => {
  const ab = e.target.closest && e.target.closest('div[data-abrir]');
  if (ab && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); hojaTarea(ab.dataset.abrir); }
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'nueva') return;
  e.preventDefault(); const fd = new FormData(e.target), titulo = String(fd.get('titulo') || '').trim(); if (!titulo) return;
  e.target.titulo.value = ''; // vacío antes de repintar: el borrador que se conserva ya no lleva el título añadido
  setEn('tareas', { id: nuevoId(), titulo, proyecto: fd.get('proyecto') || null, hito: null, estado: 'pendiente', fecha: fd.get('fecha') || null, prioridad: fd.get('prioridad') || 'media', creada: hoyISO() })('Tarea añadida ✓');
});

// siempre conectada: al abrir, al volver a la app, al recuperar la red y cada 2 minutos con la app abierta
window.addEventListener('online', () => { espera = 2000; sincronizar(); });
const guardarYa = () => { if (S.trabFlush) { const f = S.trabFlush; S.trabFlush = null; f(); } if (S.detFlush) S.detFlush(); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { pintar(); sincronizar(); } else guardarYa(); });
window.addEventListener('pagehide', guardarYa);
setInterval(() => { if (document.visibilityState === 'visible') sincronizar(); }, 120000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
pintar(); sincronizar();
</script>
</body>
