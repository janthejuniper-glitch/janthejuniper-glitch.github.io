<style>
  :root {
    color-scheme: dark;
    --bg: #0b0812; --ink: #f4effc; --mute: #c3b8da;
    --collision: #e07bff; --surrender: #9f8cff; --acc: #c9b6ff;
    --edge: rgba(201, 182, 255, .26); --edge-hi: rgba(201, 182, 255, .55);
    --card: rgba(20, 13, 34, .55); --card-hi: rgba(38, 25, 62, .7);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  /* sin fondo propio: el del body taparía el 3D (que va detrás, en z-index negativo) */
  body { margin: 0; min-height: 100svh; color: var(--ink); background: transparent;
    font: 16px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; border-radius: 18px; }

  /* fondo interactivo: rejilla de puntos que se curva alrededor del dedo o el ratón; al tocar, una onda */
  #escena { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; }
  .velo { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(90% 70% at 50% 45%, transparent 35%, rgba(11, 8, 18, .85)); }

  main { width: 100%; max-width: 440px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 28px; display: grid; gap: 14px; }

  .portada { position: relative; aspect-ratio: 4 / 5; border-radius: 28px; overflow: hidden; border: 1px solid var(--edge);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 0 1px rgba(224, 123, 255, .08), 0 0 80px rgba(159, 140, 255, .18);
    transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s ease-out; }
  .portada img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  .portada::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(11, 8, 18, .55) 68%, rgba(11, 8, 18, .94)); }
  .portada .texto { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 22px; text-align: center; }
  h1 { font-family: Unbounded, sans-serif; font-weight: 800; font-size: clamp(1.8rem, 8.6vw, 2.3rem); line-height: 1.04; letter-spacing: -.02em; margin: 0;
    background: linear-gradient(90deg, #fff, #eadfff 50%, var(--collision)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .rol { margin: 8px 0 0; font-weight: 500; color: var(--ink); font-size: .95rem; }

  .redes { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .redes a { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--edge);
    background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: transform .2s, border-color .2s, background .2s; }
  .redes a:hover { transform: translateY(-3px); border-color: var(--edge-hi); background: var(--card-hi); }
  .redes svg { width: 20px; height: 20px; fill: var(--ink); }

  .boton { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; padding: 14px 18px; border-radius: 20px;
    font-weight: 600; border: 1px solid var(--edge); background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: transform .2s, border-color .2s, background .2s; }
  .boton:hover { transform: translateY(-3px); border-color: var(--edge-hi); background: var(--card-hi); }
  .boton:active { transform: scale(.98); }
  .boton svg { width: 22px; height: 22px; fill: currentColor; flex: none; }
  .boton svg.trazo { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .principal { background: linear-gradient(120deg, var(--collision), var(--surrender)); color: #160b26; border-color: transparent; font-size: 1.05rem;
    box-shadow: 0 12px 40px rgba(224, 123, 255, .35); }
  .principal:hover { background: linear-gradient(120deg, #eb9bff, #b3a4ff); border-color: transparent; }

  .mosaico { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile { position: relative; aspect-ratio: 1; border-radius: 22px; overflow: hidden; border: 1px solid var(--edge); background: #140c22;
    transition: transform .2s, border-color .2s; }
  .tile:hover { transform: translateY(-3px); border-color: var(--edge-hi); }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
  .tile:hover img { transform: scale(1.06); }
  .tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11, 8, 18, .05) 25%, rgba(11, 8, 18, .55) 55%, rgba(11, 8, 18, .95)); }
  .tile .pie { position: absolute; left: 14px; right: 14px; bottom: 12px; z-index: 1; }
  .tile b { display: block; font-weight: 600; } .tile small { display: block; color: var(--mute); font-size: .8rem; }
  .tile .play { position: absolute; z-index: 1; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(11, 8, 18, .55); border: 1px solid rgba(255, 255, 255, .3); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .tile .play svg { width: 15px; height: 15px; fill: #fff; margin-left: 2px; }

  footer { text-align: center; color: var(--mute); font-size: .78rem; margin-top: 8px; }
  footer a { text-decoration: underline; text-underline-offset: 3px; }

  .entra { opacity: 0; transform: translateY(14px); animation: entra .7s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: calc(var(--n, 0) * 70ms); }
  @keyframes entra { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .entra { animation: none; opacity: 1; transform: none; }
    .portada, .boton, .redes a, .tile, .tile img { transition: none; }
  }

<script>

  (function () {
    var p = document.getElementById('portada')
    if (!matchMedia('(hover: hover) and (pointer: fine)').matches || matchMedia('(prefers-reduced-motion: reduce)').matches) return
    p.addEventListener('pointermove', function (e) {
      var r = p.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5
      p.style.setProperty('--ry', (x * 8).toFixed(2) + 'deg'); p.style.setProperty('--rx', (-y * 8).toFixed(2) + 'deg')
    })
    p.addEventListener('pointerleave', function () { p.style.setProperty('--ry', '0deg'); p.style.setProperty('--rx', '0deg') })
  })()

<script>
(function () {

  // ── común: tamaño, puntero (ratón o dedo), toques, scroll, pausa cuando no se ve ──
  const lienzo = document.getElementById('escena')
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches
  const P = { x: innerWidth * 0.5, y: innerHeight * 0.35, activo: false, ultimo: 0 }
  const toques = []
  addEventListener('pointermove', (e) => { P.x = e.clientX; P.y = e.clientY; P.activo = true; P.ultimo = performance.now() }, { passive: true })
  addEventListener('pointerdown', (e) => { P.x = e.clientX; P.y = e.clientY; P.activo = true; P.ultimo = performance.now(); toques.push({ x: e.clientX, y: e.clientY, t: performance.now() }); if (toques.length > 6) toques.shift() }, { passive: true })
  const scrollY_ = () => window.scrollY || document.documentElement.scrollTop || 0
  function arrancar(pintar) {
    if (quieto) { pintar(performance.now()); addEventListener('resize', () => pintar(performance.now())); return }
    let id = 0
    const bucle = (t) => { pintar(t); id = requestAnimationFrame(bucle) }
    id = requestAnimationFrame(bucle)
    document.addEventListener('visibilitychange', () => { cancelAnimationFrame(id); if (!document.hidden) id = requestAnimationFrame(bucle) })
  }
  // sin ratón (móvil), el «puntero» pasea solo despacio hasta que tocas
  function punteroVivo(t) {
    if (P.activo && t - P.ultimo < 4000) return { x: P.x, y: P.y }
    const s = t / 1000
    return { x: innerWidth * (0.5 + 0.32 * Math.sin(s * 0.13)), y: innerHeight * (0.45 + 0.3 * Math.sin(s * 0.09 + 1.3)) }
  }

  const g = lienzo.getContext('2d')
  let W = 0, H = 0, puntos = [], paso = 30
  function medir() {
    const dpr = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight
    lienzo.width = W * dpr; lienzo.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0)
    paso = W < 600 ? 26 : 32; puntos = []
    for (let y = -paso; y < H + paso * 2; y += paso) for (let x = -paso; x < W + paso * 2; x += paso) puntos.push({ bx: x, by: y, x, y })
  }
  medir(); addEventListener('resize', medir)
  let cursor = { x: W / 2, y: H / 3 }, ondas = []
  arrancar((t) => {
    const obj = punteroVivo(t); cursor.x += (obj.x - cursor.x) * 0.08; cursor.y += (obj.y - cursor.y) * 0.08
    while (toques.length) { const q = toques.shift(); ondas.push({ x: q.x, y: q.y, t: q.t }) }
    ondas = ondas.filter((o) => t - o.t < 1600)
    const s = t / 1000, desp = (scrollY_() * 0.3) % paso
    g.fillStyle = '#0b0812'; g.fillRect(0, 0, W, H)
    const hg = g.createRadialGradient(cursor.x, cursor.y, 0, cursor.x, cursor.y, 260); hg.addColorStop(0, 'rgba(159,140,255,.16)'); hg.addColorStop(1, 'rgba(159,140,255,0)')
    g.fillStyle = hg; g.fillRect(0, 0, W, H)
    for (const p of puntos) {
      const by = p.by - desp
      let dx = p.bx - cursor.x, dy = by - cursor.y, d = Math.hypot(dx, dy) + 0.001
      // gravedad: los puntos cerca del dedo se acercan a él (como si curvara el espacio)
      const tir = Math.exp(-d / 160) * 34
      let tx = p.bx - dx / d * tir, ty = by - dy / d * tir
      for (const o of ondas) { const e = (t - o.t) / 1000, ox = p.bx - o.x, oy = by - o.y, od = Math.hypot(ox, oy) + 0.001, frente = e * 520
        const k = Math.exp(-Math.abs(od - frente) / 40) * (1 - e / 1.6) * 18; tx += ox / od * k; ty += oy / od * k }
      p.x += (tx - p.x) * 0.15; p.y += (ty - p.y) * 0.15
      const ola = 0.5 + 0.5 * Math.sin(p.bx * 0.012 + by * 0.01 - s * 0.6)
      const luz = Math.exp(-d / 200)
      g.fillStyle = `rgba(${190 + 50 * luz | 0},${160 + 40 * luz | 0},255,${(0.18 + 0.16 * ola + 0.82 * luz).toFixed(3)})`
      const rr = 1.2 + 0.7 * ola + 2.2 * luz
      g.fillRect(p.x - rr / 2, p.y - rr / 2, rr, rr)
    }
  })

})()
</script>
